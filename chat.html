<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Loyola AI Assistant - Dedicated Fullscreen AI Chat for Loyola College, Chennai">
    <title>Loyola AI Assistant - Fullscreen Chat</title>
    <link rel="icon" type="image/png" href="https://loyolacollege.edu/favicon.ico">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ===== Header ===== -->
    <header class="header">
        <div class="header-inner">
            <div class="header-left">
                <button id="mobile-sidebar-toggle" class="mobile-sidebar-btn" aria-label="Toggle navigation menu">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <a href="index.html" class="header-logo-link" title="Loyola College">
                    <img id="header-logo-img" class="header-logo" src="assets/header_logo.png" alt="Loyola College Logo">
                </a>
                <span class="header-title">Loyola AI Assistant</span>
            </div>

            <div class="header-right">
                <a href="index.html" class="header-link" title="Widget Demo Showcase">
                    <span>🌐 Demo Showcase</span>
                </a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle Theme">
                    <span class="theme-icon-light">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </span>
                    <span class="theme-icon-dark">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </span>
                </button>
            </div>
        </div>
    </header>

    <!-- ===== Sliding Sidebar ===== -->
    <aside id="sidebar" class="sidebar">
        <button id="sidebar-close-btn" class="sidebar-close" aria-label="Close sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>

        <div class="college-info-card">
            <img id="college-info-logo" class="college-info-logo" src="assets/logo.png" alt="Loyola College Emblem">
            <div class="college-info-name">Loyola College</div>
            <div class="college-info-desc">Autonomous institution affiliated with University of Madras. NAAC A++ Accredited. Founded 1925.</div>
            <div class="college-info-badge">
                <span class="badge-dot"></span>
                <span>Active • Online</span>
            </div>
        </div>

        <div>
            <div class="suggested-title">Popular Questions</div>
            <div class="suggestion-chips">
                <button class="suggestion-chip" data-question="Tell me about admissions at Loyola College">
                    <span class="chip-icon">🎓</span>
                    <span class="chip-text">Admissions & Eligibility</span>
                </button>
                <button class="suggestion-chip" data-question="What undergraduate and postgraduate courses are offered?">
                    <span class="chip-icon">📚</span>
                    <span class="chip-text">Courses Offered</span>
                </button>
                <button class="suggestion-chip" data-question="What are the hostel facilities and fees?">
                    <span class="chip-icon">🏠</span>
                    <span class="chip-text">Hostel Facilities</span>
                </button>
                <button class="suggestion-chip" data-question="How are campus placements and top recruiters?">
                    <span class="chip-icon">💼</span>
                    <span class="chip-text">Placements & Packages</span>
                </button>
                <button class="suggestion-chip" data-question="What scholarships are available for students?">
                    <span class="chip-icon">💰</span>
                    <span class="chip-text">Scholarships</span>
                </button>
                <button class="suggestion-chip" data-question="What are the college office contact details?">
                    <span class="chip-icon">📞</span>
                    <span class="chip-text">Contact Office</span>
                </button>
            </div>
        </div>

        <button id="clear-history-btn" class="clear-history-btn" title="Clear saved chat history">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span>Clear Conversation</span>
        </button>
    </aside>

    <!-- ===== Main Chat Window ===== -->
    <main class="main-content">
        <div class="chat-container">
            <div id="messages-container" class="messages-container">
                <!-- Messages dynamically inserted here by Chatbot -->
            </div>

            <!-- Typing Indicator -->
            <div id="typing-indicator" class="typing-indicator" style="display: none;">
                <div class="typing-bubble">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </div>
            </div>

            <!-- Chat Input Area -->
            <div class="input-container">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="chat-input" 
                        class="chat-input" 
                        placeholder="Ask about admissions, courses, hostel, placements... (Press / to focus)"
                        autocomplete="off"
                        aria-label="Ask a question about Loyola College"
                    >
                    <button id="send-btn" class="send-btn" aria-label="Send question" title="Send (Enter)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="input-hint">Loyola AI Assistant answers queries strictly related to Loyola College Chennai.</div>
            </div>
        </div>
    </main>

    <!-- ===== Scripts ===== -->
    <script>window.__ENV__ = window.__ENV__ || {};</script>
    <script src="js/env.js" onerror="/* local env.js is optional in git/production */"></script>
    <script src="js/config.js"></script>
    <script src="js/knowledge-base.js"></script>
    <script src="js/search-engine.js"></script>
    <script src="js/ai-provider.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
